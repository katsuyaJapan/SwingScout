name: SwingScout daily update and Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "public/data/**"
  schedule:
    # 当日引け後: Yahoo補完が全候補で同期できた場合は暫定更新
    - cron: "10 7 * * 1-5" # 16:10 JST
    - cron: "10 8 * * 1-5" # 17:10 JST retry
    - cron: "10 9 * * 1-5" # 18:10 JST final after-close retry
    # JPX公式日報の掲載を軽量確認。未掲載なら全銘柄処理を起動しない。
    - cron: "30 22 * * 0-4" # 07:30 JST next business day
    - cron: "0 23 * * 0-4"  # 08:00 JST retry
    - cron: "20 23 * * 0-4" # 08:20 JST retry
    - cron: "35 23 * * 0-4" # 08:35 JST retry
    - cron: "45 23 * * 0-4" # 08:45 JST final pre-open retry
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: swingscout-daily
  cancel-in-progress: false

jobs:
  prepare_data:
    name: Update and validate data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      state: ${{ steps.result.outputs.state }}
      artifact_ready: ${{ steps.artifact.outputs.artifact-id != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JPX publication freshness
        id: freshness
        shell: bash
        run: |
          case "${{ github.event.schedule }}" in
            "30 22 * * 0-4"|"0 23 * * 0-4"|"20 23 * * 0-4"|"35 23 * * 0-4"|"45 23 * * 0-4")
              python scripts/check_jpx_freshness.py --mark-waiting
              ;;
            *)
              echo "refresh_required=true" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Install data dependencies
        if: steps.freshness.outputs.refresh_required == 'true'
        id: dependencies
        continue-on-error: true
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check xlrd openpyxl
      - name: Generate and validate complete data update
        if: steps.freshness.outputs.refresh_required == 'true' && steps.dependencies.outcome == 'success'
        id: refresh
        continue-on-error: true
        run: python scripts/run-data-pipeline.py
      - name: Record dependency failure
        if: steps.dependencies.outcome == 'failure'
        env:
          SWINGSCOUT_FAILURE_STAGE: dependencies
          SWINGSCOUT_FAILURE_MESSAGE: 更新用の依存関係の準備に失敗したため、前回正常データを表示しています。
        run: python scripts/write-failure-status.py
      - name: Record data result
        id: result
        shell: bash
        env:
          REFRESH_REQUIRED: ${{ steps.freshness.outputs.refresh_required }}
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: |
          if [ "$REFRESH_REQUIRED" != "true" ]; then
            state=waiting
          elif [ "$REFRESH_OUTCOME" = "success" ]; then
            state=$(python -c 'import json; print(json.load(open("public/data/status.json")).get("lastAttemptStatus", "failed"))')
          else
            state=failed
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" = "partial" ]; then
            echo "::warning::価格・出口判定は更新済み。補助情報の不足により候補を保留しています。"
          fi
          echo "### Data update: $state" >> "$GITHUB_STEP_SUMMARY"
          python -c 'import json; s=json.load(open("public/data/status.json")); print("Data date:", s.get("dataAsOf")); print("Reason:", s.get("message")); print("Stage:", s.get("failureStage"))' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit update state
        run: |
          git config user.name "swing-scout-bot"
          git config user.email "swing-scout-bot@users.noreply.github.com"
          git add public/data/latest.json public/data/history.json public/data/status.json public/data/update-diagnostics.json
          git diff --cached --quiet || git commit -m "data: daily SwingScout refresh"
          git push
      - name: Upload validated or restored public data
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: swingscout-public-data
          retention-days: 1
          if-no-files-found: error
          path: |
            public/data/latest.json
            public/data/history.json
            public/data/status.json
            public/data/update-diagnostics.json
      - name: Fail data update independently of publishing
        if: steps.result.outputs.state == 'failed'
        run: exit 1

  publish:
    name: Publish site
    timeout-minutes: 15
    needs: prepare_data
    if: ${{ !cancelled() && needs.prepare_data.outputs.artifact_ready == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clear checked-out data before downloading complete published set
        run: python3 -c 'import shutil; shutil.rmtree("public/data")'
      - uses: actions/download-artifact@v4
        with:
          name: swingscout-public-data
          path: public/data
      - name: Install app dependencies and build
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record publication result
        env:
          DATA_STATE: ${{ needs.prepare_data.outputs.state }}
        run: |
          echo "### Pages publication: success" >> "$GITHUB_STEP_SUMMARY"
          echo "Data update: $DATA_STATE" >> "$GITHUB_STEP_SUMMARY"
